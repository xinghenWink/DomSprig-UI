<!-- @api
### 类名与属性
| 名称 | 说明 |
|---|---|
| `.nv-text-gradient` | 流动渐变文字。`--nv-text-gradient` 自定义渐变（首尾同色才能无缝），`--nv-text-gradient-duration` 默认 `8s` |
| `.nv-text-shine` | 扫光。`--nv-text-shine-base` 底色、`--nv-text-shine-color` 高光、`--nv-text-shine-duration` 默认 `3.2s` |
| `data-nv-text="type"` | 打字机 |
| `data-nv-text="blur-in"` | 模糊淡入 |
| `data-nv-text="scramble"` | 乱码解码 |
| `data-nv-text="rotate"` | 词语轮换 |

### 选项（写成 data-* 属性）
| 特效 | 属性 | 默认 |
|---|---|---|
| type | `data-words`（竖线分隔）、`data-speed` 打字间隔、`data-delete-speed` 删除间隔、`data-pause` 停顿、`data-delay`、`data-loop`、`data-caret`、`data-reserve`（预留最长词宽度）、`data-label`（读屏文案） | `70` `35` `1600` `300` `true` `true` `false` |
| blur-in | `data-split`（`word` / `char`）、`data-duration`、`data-stagger`、`data-delay`、`data-threshold` | `word` `700` `60` `0` `0.3` |
| scramble | `data-duration`、`data-delay`、`data-chars` 随机字符集、`data-replay`（悬停重播）、`data-trigger`（`view` 进入视口 / 其他值不自动播放） | `900` `0` — `true` `view` |
| rotate | `data-words`、`data-interval`、`data-label` | — `2200` — |

### 事件
| 事件 | 说明 |
|---|---|
| `nv:done` | blur-in / scramble 播放结束、type 在 `data-loop="false"` 时打完最后一个词 |
| `nv:change` | rotate 切换词语，`detail: { index, word }` |

### 无障碍与降级
- 拆分出的动画片段一律 `aria-hidden`，完整原文放在 `.nv-sr-only` 中；blur-in / scramble 结束后把原始节点放回去，复制、选中、换行都正常。
- 减少动态：blur-in / scramble 直接显示原文，打字机显示第一个词，轮换停在第一个词。
-->
