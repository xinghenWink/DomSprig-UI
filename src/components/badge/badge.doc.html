<!--
@name badge
@title Badge 徽标
@category general
@order 40
@deps button
@desc 小号的状态、分类与计数标记。.nv-badge 用于行内文字徽标（soft / solid / outline / surface 四种外观、六种语义色、状态圆点）；.nv-indicator 给图标、按钮、头像加数字或圆点角标，支持 99+、呼吸动效和四个方位。纯 CSS。
-->

<!-- @demo 数字与圆点角标 | `.nv-indicator` 包住任意元素，`data-count` 显示数字（超过上限自己写成 `99+`），`data-dot` 只显示圆点，`data-pulse` 加呼吸扩散。角标是 CSS 生成的内容，读屏软件读不到，请在被包住的按钮上写完整的 `aria-label`。 | left -->
<div class="doc-row" style="gap:20px">
  <span class="nv-indicator" data-count="3">

  </span>
  <span class="nv-indicator" data-dot>

    <button type="button" class="nv-btn" data-variant="soft" data-color="neutral">更新日志</button>

<!-- @demo 位置与贴合圆形 | `data-placement` 取 top-end（默认）、top-start、bottom-end、bottom-start。包住头像这类圆形元素时加 `data-overlap="circle"`，角标会落在圆周上，不会悬在外接正方形的角外。 | left -->

<style>

<!-- @demo 在导航与标题里 | 侧边导航的未读数、标题旁的版本与「新」标记、套餐卡片的推荐角标都是 `.nv-badge` 的典型位置。数字徽标默认用等宽数字，计数变化时宽度不跳。 | left -->

<!-- @demo 动态更新计数 | 角标内容来自属性，改 `data-count` 即可更新；`"0"` 时角标缩小隐藏（带过渡），加 `data-show-zero` 则保留 0。同时更新按钮的 `aria-label`，读屏用户才能听到新数量。 | left -->
<div class="doc-row" style="gap:16px">
  <span class="nv-indicator" data-count="4" id="badge-cart">
    <button type="button" class="nv-btn" data-variant="outline" data-color="neutral" data-icon aria-label="购物车，4 件商品" id="badge-cart-btn"><i data-nv-icon="credit-card"></i></button>
  </span>
  <div class="nv-btn-group">
    <button type="button" class="nv-btn" data-variant="outline" data-color="neutral" data-size="sm" id="badge-cart-minus" aria-label="减少一件"><i data-nv-icon="minus"></i></button>
    <button type="button" class="nv-btn" data-variant="outline" data-color="neutral" data-size="sm" id="badge-cart-plus" aria-label="增加一件"><i data-nv-icon="plus"></i></button>
  </div>
  <button type="button" class="nv-btn" data-variant="ghost" data-color="neutral" data-size="sm" id="badge-cart-many">设为 120</button>
  <span class="doc-log" id="badge-cart-log" style="margin:0" aria-live="polite">4 件商品</span>
</div>
<script>
  {
    const ind = document.getElementById('badge-cart');
    const btn = document.getElementById('badge-cart-btn');
    const log = document.getElementById('badge-cart-log');
    let n = 4;
    const render = () => {
      ind.dataset.count = n > 99 ? '99+' : String(n);
      btn.setAttribute('aria-label', `购物车，${n} 件商品`);
      log.textContent = n ? `${n} 件商品` : '购物车是空的';
    };
    document.getElementById('badge-cart-plus').addEventListener('click', () => { n += 1; render(); });
    document.getElementById('badge-cart-minus').addEventListener('click', () => { n = Math.max(0, n - 1); render(); });
    document.getElementById('badge-cart-many').addEventListener('click', () => { n = 120; render(); });
  }
</script>

<!-- @api
### .nv-badge 行内徽标
| 属性 | 说明 | 取值 | 默认 |
|---|---|---|---|
| `class="nv-badge"` | 基础类，可用在 `span` `a` 等行内元素上 | — | — |
| `data-variant` | 外观 | `soft` `solid` `outline` `surface` | `soft` |
| `data-color` | 语义色；不写时 soft/outline/surface 为中性灰，solid 为主色 | `neutral` `primary` `success` `warning` `danger` `info` | — |
| `data-size` | 尺寸，高度 18 / 22 / 26px | `sm` `md` `lg` | `md` |
| `data-dot` | 文字前加同色圆点；元素为空时变成 8px 纯圆点 | 布尔 | — |
| `data-shape` | `square` 改为小圆角（版本号、许可证） | `square` | 胶囊 |
| 子元素 `svg` / `<i data-nv-icon>` | 前置图标，自动按字号缩放 | — | — |

### .nv-indicator 角标
| 属性 | 说明 | 取值 | 默认 |
|---|---|---|---|
| `class="nv-indicator"` | 包住按钮、图标、头像等元素 | — | — |
| `data-count` | 角标文字；`"0"` 或空字符串时隐藏 | 字符串，如 `"8"` `"99+"` `"NEW"` | — |
| `data-show-zero` | 数字为 0 时仍然显示 | 布尔 | — |
| `data-dot` | 只显示 10px 圆点（与 `data-count` 二选一） | 布尔 | — |
| `data-pulse` | 呼吸扩散动画；系统开启「减少动态效果」时关闭 | 布尔 | — |
| `data-color` | 角标颜色 | `danger` `primary` `success` `warning` `info` `neutral` | `danger` |
| `data-size` | `sm` 缩小为 16px 数字 / 8px 圆点 | `sm` | — |
| `data-placement` | 方位 | `top-end` `top-start` `bottom-end` `bottom-start` | `top-end` |
| `data-overlap` | `circle` 贴合圆形元素（落在圆周上）；`inset` 向内收 6px，适合大圆角方块 | `circle` `inset` | — |

### 无障碍
- 徽标文字是正常文本，读屏会按顺序读出；纯圆点徽标（空元素）请加 `aria-label` 或在旁边写出状态文字。
- 角标由 CSS `::after` 生成，读屏软件不会读出。请在被包住的可交互元素上写完整的 `aria-label`（如「通知，3 条未读」），数量变化时一起更新。
- 颜色不是唯一的信息来源：状态徽标总是带文字，或配合图标。

### CSS 变量
| 变量 | 说明 |
|---|---|
| `--nv-badge-bg` / `--nv-badge-fg` | 覆盖徽标背景色 / 文字色 |
| `--nv-badge-height` | 覆盖徽标高度（同时作为最小宽度） |
| `--nv-badge-radius` | 覆盖圆角 |
| `--nv-indicator-bg` | 覆盖角标背景色 |
| `--nv-indicator-ring` | 角标外圈描边颜色，默认 `--nv-surface`；放在彩色背景上时改成背景色 |
-->
